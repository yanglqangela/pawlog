<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>爪迹 PawLog · 养宠成长记录与社区</title>
<meta name="description" content="记录宠物体重、疫苗、驱虫，生成成长时间线，找到附近的宠友，分享养宠日常。">
<meta name="theme-color" content="#C24A2B">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<a class="skip-link" id="skip-link" href="#view">跳到主内容</a>

<div class="shell">

  <!-- ── 桌面侧边栏 ── -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand__mark">🐾</span>
      <span class="brand__text">爪迹<em>PawLog</em></span>
    </div>

    <nav class="nav" id="nav-desktop">
      <button class="nav__item erx-nav" id="btn-erx-desktop" type="button" title="急救 / 就医信息">
        <span class="erx-nav__ico" aria-hidden="true">🚨</span><span>急救 · 就医信息</span>
      </button>
      <a class="nav__item" href="#/dashboard" data-nav="dashboard">
        <span class="nav__ico"></span><span>首页</span>
      </a>
      <a class="nav__item" href="#/health" data-nav="health">
        <span class="nav__ico"></span><span>健康档案</span>
      </a>
      <a class="nav__item" href="#/timeline" data-nav="timeline">
        <span class="nav__ico"></span><span>成长时光</span>
      </a>
      <a class="nav__item" href="#/nearby" data-nav="nearby">
        <span class="nav__ico"></span><span>附近宠友</span>
      </a>
      <a class="nav__item" href="#/community" data-nav="community">
        <span class="nav__ico"></span><span>社区</span>
      </a>
    </nav>

    <div class="sidebar__foot">
      <a class="nav__item" href="#/me" data-nav="me">
        <span class="nav__ico"></span><span>我的</span>
      </a>
      <div class="petswitch" id="petswitch"></div>
      <p class="sidebar__note">数据保存在本机浏览器<br>可在「我的」里导出备份</p>
    </div>
  </aside>

  <!-- ── 主区域 ── -->
  <div class="main">
    <header class="topbar">
      <div class="topbar__brand">
        <span class="brand__mark">🐾</span><span>爪迹</span>
      </div>
      <div class="topbar__right">
        <div class="petswitch petswitch--compact" id="petswitch-mobile"></div>
        <button class="erx-entry" id="btn-erx" type="button" title="急救 / 就医信息" aria-label="急救 / 就医信息">🚨 <span>急救</span></button>
        <a class="avatar" href="#/me" data-nav="me" id="btn-me" title="我的" style="width:32px;height:32px;font-size:17px">🙂</a>
        <button class="btn btn--ghost btn--icon" id="btn-about" title="关于">?</button>
      </div>
    </header>

    <div class="storage-banner" id="storage-banner" hidden>
      <span class="storage-banner__ico" aria-hidden="true">⚠️</span>
      <span class="grow" id="storage-banner-text"></span>
      <button class="btn btn--ghost btn--sm" id="storage-banner-action">去备份</button>
      <button class="btn btn--ghost btn--icon" id="storage-banner-close" aria-label="关闭提示">✕</button>
    </div>

    <div class="offline-banner" id="offline-banner" role="status" aria-live="polite" hidden>
      离线模式 · 档案、待办与就医卡仍可查看
    </div>

    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<!-- ── 移动端底部标签栏 ── -->
<nav class="tabbar" id="nav-mobile">
  <a class="tabbar__item" href="#/dashboard" data-nav="dashboard">
    <span class="nav__ico"></span><span>首页</span>
  </a>
  <a class="tabbar__item" href="#/health" data-nav="health">
    <span class="nav__ico"></span><span>健康</span>
  </a>
  <a class="tabbar__item" href="#/timeline" data-nav="timeline">
    <span class="nav__ico"></span><span>时光</span>
  </a>
  <a class="tabbar__item" href="#/nearby" data-nav="nearby">
    <span class="nav__ico"></span><span>附近</span>
  </a>
  <a class="tabbar__item" href="#/community" data-nav="community">
    <span class="nav__ico"></span><span>社区</span>
  </a>
</nav>

<div id="erx-root"></div>
<div class="modal-root" id="modal-root"></div>
<div class="toast-root" id="toast-root" role="status" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
