<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>爪迹 PawLog · 养宠成长记录与社区</title>
<meta name="description" content="记录宠物体重、疫苗、驱虫，生成成长时间线，找到附近的宠友，分享养宠日常。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<div class="shell">

  <!-- ── 桌面侧边栏 ── -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand__mark">🐾</span>
      <span class="brand__text">爪迹<em>PawLog</em></span>
    </div>

    <nav class="nav" id="nav-desktop">
      <a class="nav__item" href="#/dashboard" data-nav="dashboard">
        <span class="nav__ico"></span><span>首页</span>
      </a>
      <a class="nav__item" href="#/health" data-nav="health">
        <span class="nav__ico"></span><span>健康档案</span>
      </a>
      <a class="nav__item" href="#/timeline" data-nav="timeline">
        <span class="nav__ico"></span><span>成长时光</span>
      </a>
      <a class="nav__item" href="#/nearby" data-nav="nearby">
        <span class="nav__ico"></span><span>附近宠友</span>
      </a>
      <a class="nav__item" href="#/community" data-nav="community">
        <span class="nav__ico"></span><span>社区</span>
      </a>
    </nav>

    <div class="sidebar__foot">
      <div class="petswitch" id="petswitch"></div>
      <p class="sidebar__note">数据保存在本机浏览器<br>无需注册即可体验</p>
    </div>
  </aside>

  <!-- ── 主区域 ── -->
  <div class="main">
    <header class="topbar">
      <div class="topbar__brand">
        <span class="brand__mark">🐾</span><span>爪迹</span>
      </div>
      <div class="topbar__right">
        <div class="petswitch petswitch--compact" id="petswitch-mobile"></div>
        <button class="btn btn--ghost btn--icon" id="btn-about" title="关于">?</button>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <!-- ── 移动端底部标签栏 ── -->
  <nav class="tabbar" id="nav-mobile">
    <a class="tabbar__item" href="#/dashboard" data-nav="dashboard">
      <span class="nav__ico"></span><span>首页</span>
    </a>
    <a class="tabbar__item" href="#/health" data-nav="health">
      <span class="nav__ico"></span><span>健康</span>
    </a>
    <a class="tabbar__item" href="#/timeline" data-nav="timeline">
      <span class="nav__ico"></span><span>时光</span>
    </a>
    <a class="tabbar__item" href="#/nearby" data-nav="nearby">
      <span class="nav__ico"></span><span>附近</span>
    </a>
    <a class="tabbar__item" href="#/community" data-nav="community">
      <span class="nav__ico"></span><span>社区</span>
    </a>
  </nav>

</div>

<div class="modal-root" id="modal-root"></div>
<div class="toast-root" id="toast-root"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
